<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1800" height="750" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Visualization of the SIMCA model</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#231f20"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>
  <!-- boxes -->
  <rect x="20" y="50" width="430" height="170" rx="24" fill="#eef0f1"/>
  <text x="44" y="112" font-size="25" font-weight="700" fill="#231f20">Perceived Violated Moral Beliefs</text>
  <text x="44" y="146" font-size="23" fill="#231f20">•  Moral conviction, values, rights</text>
  <text x="44" y="178" font-size="23" fill="#231f20">•  Group morality</text>

  <rect x="20" y="300" width="430" height="170" rx="24" fill="#eef0f1"/>
  <text x="44" y="362" font-size="25" font-weight="700" fill="#231f20">(Politicized) Identity</text>
  <text x="44" y="396" font-size="23" fill="#231f20">•  Group identification</text>
  <text x="44" y="428" font-size="23" fill="#231f20">•  Identity content</text>

  <rect x="555" y="10" width="330" height="100" rx="20" fill="#eef0f1"/>
  <text x="720" y="68" font-size="25" font-weight="700" fill="#231f20" text-anchor="middle">Group-Based Anger</text>

  <rect x="555" y="390" width="330" height="100" rx="20" fill="#eef0f1"/>
  <text x="720" y="448" font-size="25" font-weight="700" fill="#231f20" text-anchor="middle">Collective Efficacy</text>

  <rect x="845" y="205" width="340" height="110" rx="20" fill="#d7f0fc"/>
  <text x="1015" y="268" font-size="26" font-weight="700" fill="#231f20" text-anchor="middle">Collective Action</text>

  <!-- arrows -->
  <g stroke="#231f20" stroke-width="3" fill="none">
    <line x1="455" y1="125" x2="550" y2="62" marker-end="url(#ah)"/>
    <line x1="455" y1="390" x2="550" y2="440" marker-end="url(#ah)"/>
    <line x1="225" y1="228" x2="225" y2="292" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <line x1="270" y1="258" x2="838" y2="260" marker-end="url(#ah)"/>
    <line x1="885" y1="60" x2="1010" y2="198" marker-end="url(#ah)"/>
    <line x1="885" y1="440" x2="1010" y2="322" marker-end="url(#ah)"/>
  </g>
</svg>
